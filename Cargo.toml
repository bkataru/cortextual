[package]
name = "cortextual"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "yet another context/memory system for AI agents"
license = "MIT"
repository = "https://github.com/bkataru/cortextual"
keywords = ["ai", "agent", "memory", "context"]
categories = ["ai", "memory", "context"]
readme = "README.md"
authors = ["bkataru <baalateja.k@gmail.com>"]

[dependencies]
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v7"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
